# ============================================================
# Car Rental System - Docker Compose
# ============================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down       # Stop all services
#   docker-compose exec web python app.py  # Run commands in container
# ============================================================

services:
  # ------------------------------------------
  # MySQL Database
  # ------------------------------------------
  db:
    image: mysql:8.0
    container_name: car_rental_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-car_rental_system}
      MYSQL_USER: ${DB_USER:-carrental}
      MYSQL_PASSWORD: ${DB_PASSWORD:-carrentalpass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    networks:
      - car_rental_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ------------------------------------------
  # Flask Application
  # ------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_rental_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Flask settings
      FLASK_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      
      # Database
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-car_rental_system}
      DB_USER: ${DB_USER:-carrental}
      DB_PASSWORD: ${DB_PASSWORD:-carrentalpass}
      
      # Mail (SMTP)
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: "True"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@carrental.com}
      
      # Payment gateways
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY}
      PAYMONGO_PUBLIC_KEY: ${PAYMONGO_PUBLIC_KEY}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET}
      PAYMONGO_MODE: ${PAYMONGO_MODE:-sandbox}
      
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      
      # OCR
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - ./MyFlaskApp:/app/MyFlaskApp:ro
      - ./app.py:/app/app.py:ro
      - uploads:/app/MyFlaskApp/base/uploads
      - ./database.txt:/app/database.txt:ro
    ports:
      - "5000:5000"
    networks:
      - car_rental_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ------------------------------------------
  # Adminer (Database Management UI) - Optional
  # ------------------------------------------
  adminer:
    image: adminer:latest
    container_name: car_rental_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - car_rental_network

  # ------------------------------------------
  # ngrok Tunnel Service
  # ------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: car_rental_ngrok
    restart: unless-stopped
    depends_on:
      - web
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
      NGROK_LOG_LEVEL: info
    command: http web:5000
    ports:
      - "4040:4040"
    networks:
      - car_rental_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  car_rental_network:
    driver: bridge

volumes:
  mysql_data:
  uploads:
    driver: local