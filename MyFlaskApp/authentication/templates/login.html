{% extends "base/templates/base.html" %}

{% block title %}Login - CarRental Pro{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 80px auto;">
    <div style="background: white; border-radius: 24px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
        <h2 style="text-align: center; margin-bottom: 8px; color: #1f3a5f;">Welcome Back</h2>
        <p style="text-align: center; margin-bottom: 32px; color: #666;">Login to your account</p>
        
        <form id="loginForm">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #1f3a5f;">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 16px;">
            </div>
            
            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #1f3a5f;">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" required placeholder="Enter your password" style="width: 100%; padding: 12px 44px 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 16px;">
                    <i class="fas fa-eye" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; font-size: 18px;"></i>
                </div>
            </div>
            
            <div style="display: flex; justify-content: center;">
                <button type="submit" class="btn-primary" style="padding: 14px 32px; font-size: 16px; font-weight: 600; border: none; border-radius: 40px; cursor: pointer;">
                    Login
                </button>
            </div>
        </form>
        
        <p style="text-align: center; margin-top: 24px; color: #666;">
            Don't have an account? <a href="{{ url_for('auth_bp.register') }}" style="color: #0f3b6f; text-decoration: none; font-weight: 600;">Sign up</a>
        </p>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
        showAlert('error', 'Please fill in all fields');
        return;
    }
    
    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
    
    fetch('{{ url_for('auth_bp.login') }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email, password })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showAlert('success', data.message);
            setTimeout(() => {
                window.location.href = data.redirect;
            }, 1000);
        } else {
            showAlert('error', data.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Login';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showAlert('error', 'An error occurred. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Login';
    });
});

function showAlert(type, message) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type}`;
    alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
    const container = document.querySelector('.container');
    container.insertBefore(alertDiv, container.firstChild);
    
    setTimeout(() => {
        alertDiv.remove();
    }, 5000);
}

// Toggle password visibility
document.getElementById('togglePassword').addEventListener('click', function() {
    const passwordInput = document.getElementById('password');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        this.classList.remove('fa-eye');
        this.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        this.classList.remove('fa-eye-slash');
        this.classList.add('fa-eye');
    }
});
</script>
{% endblock %}
