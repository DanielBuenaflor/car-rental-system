{% extends "base/templates/base.html" %}

{% block title %}Manage Bookings - CarRental Pro{% endblock %}

{% block content %}
<div class="{% if request.endpoint in ['base_bp.index', 'base_bp.browse_fleet', 'base_bp.testimonials', 'admin_bp.manage_bookings'] %}container-full{% else %}container{% endif %}">
    <h2 style="margin-bottom: 30px;">Manage Bookings</h2>

    <!-- Filters -->
    <div class="card" style="margin-bottom: 20px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div class="form-group">
                <label>Status</label>
                <select id="statusFilter" class="filter-input">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="form-group">
                <label>From Date</label>
                <input type="date" id="dateFrom" class="filter-input">
            </div>
            <div class="form-group">
                <label>To Date</label>
                <input type="date" id="dateTo" class="filter-input">
            </div>
            <div class="form-group">
                <label>Search</label>
                <input type="text" id="searchInput" placeholder="User or vehicle..." class="filter-input">
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end;">
                <button class="btn-primary" onclick="applyFilters()">Apply Filters</button>
                <button class="btn-secondary" onclick="resetFilters()" style="margin-left: 10px;">Reset</button>
            </div>
        </div>
    </div>

    <div id="bookingsGrid" class="bookings-grid" style="margin-top: 24px;">
        <!-- Cards will be inserted here by JavaScript -->
    </div>
    <div id="pagination" style="margin-top: 20px; text-align: center;"></div>
</div>

<!-- View Booking Modal -->
<div id="bookingModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> Booking Details</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body" id="bookingDetailsContent">
            <div style="text-align: center; padding: 20px;">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>
        </div>
    </div>
</div>

<style>
    /* Bookings Grid - Responsive Card Layout */
    .bookings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 28px;
        margin-top: 24px;
    }

    /* Extra large screens */
    @media (min-width: 1200px) {
        .bookings-grid {
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 32px;
        }
    }

    /* Individual Booking Card */
    .booking-card-item {
        background: white;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        border: 1px solid rgba(15, 59, 111, 0.1);
        transition: all 0.3s;
    }

    .booking-card-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    /* Card Header with Reference + Status */
    .booking-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e2e8f0;
    }

    .booking-ref {
        font-weight: 700;
        color: #0f3b6f;
        font-size: 14px;
    }

    /* User Info */
    .booking-vehicle {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        padding: 12px;
        background: #f8fafc;
        border-radius: 12px;
    }

    .booking-vehicle i {
        font-size: 28px;
        color: #0f3b6f;
    }

    .booking-vehicle-info strong {
        display: block;
        font-size: 14px;
        color: #1e293b;
    }

    .booking-vehicle-info span {
        font-size: 12px;
        color: #64748b;
    }

    /* Vehicle Info */
    .booking-vehicle-v {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding: 12px;
        background: #f8fafc;
        border-radius: 12px;
    }

    .booking-vehicle-v i {
        font-size: 28px;
        color: #0f3b6f;
    }

    .booking-vehicle-v-info strong {
        display: block;
        font-size: 14px;
        color: #1e293b;
    }

    .booking-vehicle-v-info span {
        font-size: 12px;
        color: #64748b;
    }

    /* Details Grid */
    .booking-details {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 16px;
    }

    .booking-detail-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .booking-detail-item .label {
        font-size: 11px;
        color: #64748b;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .booking-detail-item .value {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
    }

    /* Status Badge */
    .badge-pending { background: #fed7aa; color: #9b2c1d; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-confirmed { background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-active { background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-completed { background: #e0e7ff; color: #3730a3; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }

    /* Actions */
    .booking-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
    }

    .booking-actions .btn-sm {
        flex: 1;
        min-width: 80px;
        text-align: center;
        padding: 8px 12px;
        font-size: 12px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-primary {
        background: #0f3b6f;
        color: white;
    }
    .btn-primary:hover { background: #1e4a7a; }

    .btn-secondary {
        background: #e2e8f0;
        color: #1f3a5f;
    }

    /* Modal Styles */
    .modal {
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background-color: white;
        width: 90%;
        max-width: 600px;
        border-radius: 24px;
        max-height: 85vh;
        overflow-y: auto;
        animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 24px 24px 0 0;
    }

    .modal-header h3 {
        margin: 0;
        color: #0f3b6f;
    }

    .close {
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: #666;
        transition: color 0.2s;
    }

    .close:hover {
        color: #000;
    }

    .modal-body {
        padding: 24px;
        pointer-events: auto;
    }

    .modal-body button {
        pointer-events: auto;
        cursor: pointer !important;
    }

    .detail-section {
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e2e8f0;
    }

    .detail-section:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
    }

    .detail-section h4 {
        color: #0f3b6f;
        margin-bottom: 12px;
        font-size: 16px;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px dashed #f1f5f9;
    }

    .detail-row .label {
        font-weight: 600;
        color: #475569;
    }

    .detail-row .value {
        color: #1e293b;
        font-weight: 500;
    }

    .modal-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .bookings-grid {
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .booking-details {
            grid-template-columns: 1fr 1fr;
        }

        .modal-content {
            width: 95%;
            margin: 10px;
        }
    }

    @media (max-width: 480px) {
        .booking-card-item {
            padding: 16px;
        }

        .booking-details {
            grid-template-columns: 1fr;
        }

        .booking-actions .btn-sm {
            flex: 1 1 100%;
        }
    }

    .filter-input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
    }
</style>

<script>
    let allBookings = [];
    let currentPage = 1;
    let itemsPerPage = 10;
    let currentFilters = { status: 'all', dateFrom: '', dateTo: '', search: '' };

    function escapeHtml(text) {
        if (text == null) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function loadBookings() {
        fetch('{{ url_for("admin_bp.api_get_bookings") }}', { credentials: 'same-origin' })
            .then(response => response.json())
            .then(bookings => {
                allBookings = bookings;
                applyFilters();
            })
            .catch(error => console.error('Error loading bookings:', error));
    }

    function applyFilters() {
        currentFilters = {
            status: document.getElementById('statusFilter').value,
            dateFrom: document.getElementById('dateFrom').value,
            dateTo: document.getElementById('dateTo').value,
            search: document.getElementById('searchInput').value.toLowerCase()
        };
        currentPage = 1;
        filterAndDisplayBookings();
    }

    function resetFilters() {
        document.getElementById('statusFilter').value = 'all';
        document.getElementById('dateFrom').value = '';
        document.getElementById('dateTo').value = '';
        document.getElementById('searchInput').value = '';
        applyFilters();
    }

    function filterAndDisplayBookings() {
        let filtered = allBookings;

        if (currentFilters.status !== 'all') {
            filtered = filtered.filter(b => b.status === currentFilters.status);
        }

        // Filter by Date From
        if (currentFilters.dateFrom) {
            const fromDate = new Date(currentFilters.dateFrom);
            fromDate.setHours(0, 0, 0, 0);
            filtered = filtered.filter(b => new Date(b.start_date) >= fromDate);
        }

        // Filter by Date To
        if (currentFilters.dateTo) {
            const toDate = new Date(currentFilters.dateTo);
            toDate.setHours(23, 59, 59, 999);
            filtered = filtered.filter(b => new Date(b.end_date) <= toDate);
        }

        // Filter by Search Text
        if (currentFilters.search) {
            const searchTerm = currentFilters.search.toLowerCase();
            filtered = filtered.filter(b =>
                (b.user_name && b.user_name.toLowerCase().includes(searchTerm)) ||
                (b.brand_name && b.brand_name.toLowerCase().includes(searchTerm)) ||
                (b.model && b.model.toLowerCase().includes(searchTerm))
            );
        }

        const totalPages = Math.ceil(filtered.length / itemsPerPage);
        const start = (currentPage - 1) * itemsPerPage;
        const paginated = filtered.slice(start, start + itemsPerPage);

        displayBookings(paginated);
        displayPagination(totalPages);
    }

    function displayBookings(bookings) {
        const grid = document.getElementById('bookingsGrid');
        if (bookings.length === 0) {
            grid.innerHTML = '<div style="text-align: center; padding: 60px; color: #64748b;">No bookings found</div>';
            return;
        }

        grid.innerHTML = bookings.map(booking => `
            <div class="booking-card-item">
                <!-- Header: Reference + Status -->
                <div class="booking-card-header">
                    <span class="booking-ref">${escapeHtml(booking.booking_reference || 'N/A')}</span>
                    <span class="badge badge-${booking.status}">${booking.status}</span>
                </div>

                <!-- User Info -->
                <div class="booking-vehicle">
                    <i class="fas fa-user"></i>
                    <div class="booking-vehicle-info">
                        <strong>${escapeHtml(booking.user_name || 'N/A')}</strong>
                        <span>${escapeHtml(booking.user_email || 'N/A')}</span>
                    </div>
                </div>

                <!-- Vehicle Info -->
                <div class="booking-vehicle-v">
                    <i class="fas fa-car"></i>
                    <div class="booking-vehicle-v-info">
                        <strong>${escapeHtml(booking.brand_name)} ${escapeHtml(booking.model)}</strong>
                        <span>${booking.year || ''} • ${escapeHtml(booking.license_plate || 'No Plate')}</span>
                    </div>
                </div>

                <!-- Details -->
                <div class="booking-details">
                    <div class="booking-detail-item">
                        <span class="label">Start Date</span>
                        <span class="value">${booking.start_date ? new Date(booking.start_date).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }) : 'N/A'}</span>
                    </div>
                    <div class="booking-detail-item">
                        <span class="label">End Date</span>
                        <span class="value">${booking.end_date ? new Date(booking.end_date).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }) : 'N/A'}</span>
                    </div>
                    <div class="booking-detail-item">
                        <span class="label">Days</span>
                        <span class="value">${booking.rental_days}</span>
                    </div>
                    <div class="booking-detail-item">
                        <span class="label">Total</span>
                        <span class="value" style="color: #0f3b6f;">₱${Number(booking.total_amount || 0).toFixed(2)}</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="booking-actions">
                    <button class="btn-sm btn-primary" onclick="viewBooking(${booking.id})" style="flex: 1;">
                        <i class="fas fa-info-circle"></i> View Details
                    </button>
                </div>
            </div>
        `).join('');
    }

    function displayPagination(totalPages) {
        const paginationDiv = document.getElementById('pagination');
        if (totalPages <= 1) {
            paginationDiv.innerHTML = '';
            return;
        }

        let html = '<div style="display: flex; gap: 5px; justify-content: center;">';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="btn-sm ${i === currentPage ? 'btn-primary' : 'btn-secondary'}" onclick="goToPage(${i})">${i}</button>`;
        }
        html += '</div>';
        paginationDiv.innerHTML = html;
    }

    function goToPage(page) {
        currentPage = page;
        filterAndDisplayBookings();
    }

    let currentBookingId = null;

    function viewBooking(bookingId) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) {
            document.getElementById('bookingDetailsContent').innerHTML = `
                <div style="text-align: center; padding: 20px; color: #ef4444;">
                    <i class="fas fa-exclamation-circle"></i> Booking not found
                </div>
            `;
            document.getElementById('bookingModal').style.display = 'flex';
            return;
        }

        currentBookingId = bookingId;

        // Format dates
        const startDate = booking.start_date ? new Date(booking.start_date).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A';
        const endDate = booking.end_date ? new Date(booking.end_date).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' }) : 'N/A';
        const createdDate = booking.created_at ? new Date(booking.created_at).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'N/A';

        // Get status color
        const statusClass = `badge-${booking.status}`;

        const html = `
            <div class="detail-section">
                <h4><i class="fas fa-ticket-alt"></i> Booking Information</h4>
                <div class="detail-row">
                    <span class="label">Booking Reference:</span>
                    <span class="value"><strong>${escapeHtml(booking.booking_reference || 'N/A')}</strong></span>
                </div>
                <div class="detail-row">
                    <span class="label">Status:</span>
                    <span class="value"><span class="status-badge ${statusClass}">${booking.status.toUpperCase()}</span></span>
                </div>
                <div class="detail-row">
                    <span class="label">Created On:</span>
                    <span class="value">${createdDate}</span>
                </div>
            </div>

            <div class="detail-section">
                <h4><i class="fas fa-user"></i> Customer Information</h4>
                <div class="detail-row">
                    <span class="label">Name:</span>
                    <span class="value">${escapeHtml(booking.user_name)}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Email:</span>
                    <span class="value">${escapeHtml(booking.user_email)}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Phone:</span>
                    <span class="value">${escapeHtml(booking.user_phone || 'N/A')}</span>
                </div>
            </div>

            <div class="detail-section">
                <h4><i class="fas fa-car"></i> Vehicle Details</h4>
                <div class="detail-row">
                    <span class="label">Vehicle:</span>
                    <span class="value">${escapeHtml(booking.brand_name)} ${escapeHtml(booking.model)} (${booking.year})</span>
                </div>
                <div class="detail-row">
                    <span class="label">License Plate:</span>
                    <span class="value">${escapeHtml(booking.license_plate || 'N/A')}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Transmission:</span>
                    <span class="value">${escapeHtml(booking.transmission || 'N/A')}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Fuel Type:</span>
                    <span class="value">${escapeHtml(booking.fuel_type || 'N/A')}</span>
                </div>
            </div>

            <div class="detail-section">
                <h4><i class="fas fa-calendar-alt"></i> Rental Period</h4>
                <div class="detail-row">
                    <span class="label">Pickup Date:</span>
                    <span class="value">${startDate}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Return Date:</span>
                    <span class="value">${endDate}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Rental Days:</span>
                    <span class="value">${booking.rental_days} day${booking.rental_days !== 1 ? 's' : ''}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Pickup Location:</span>
                    <span class="value">${escapeHtml(booking.pickup_location || 'N/A')}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Return Location:</span>
                    <span class="value">${escapeHtml(booking.return_location || 'N/A')}</span>
                </div>
            </div>

            <div class="detail-section">
                <h4><i class="fas fa-receipt"></i> Payment Details</h4>
                <div class="detail-row">
                    <span class="label">Daily Rate:</span>
                    <span class="value">₱${Number(booking.daily_rate_applied || booking.daily_rate || 0).toFixed(2)}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Subtotal:</span>
                    <span class="value">₱${Number(booking.subtotal || 0).toFixed(2)}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Tax (10%):</span>
                    <span class="value">₱${Number(booking.tax_amount || 0).toFixed(2)}</span>
                </div>
                ${booking.discount_amount && booking.discount_amount > 0 ? `
                <div class="detail-row" style="color: #10b981;">
                    <span class="label">Discount:</span>
                    <span class="value">-₱${Number(booking.discount_amount).toFixed(2)}</span>
                </div>
                ` : ''}
                <div class="detail-row" style="font-weight: bold; border-top: 1px solid #e2e8f0; margin-top: 8px; padding-top: 8px;">
                    <span class="label">Total Amount:</span>
                    <span class="value" style="color: #0f3b6f; font-size: 18px;">₱${Number(booking.total_amount || 0).toFixed(2)}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Security Deposit:</span>
                    <span class="value">₱${Number(booking.security_deposit || 0).toFixed(2)}</span>
                </div>
            </div>
        `;

        // Add status update section at the bottom
        const fullHtml = html + `
            <div style="border-top: 1px solid #e2e8f0; padding-top: 20px; margin-top: 20px;">
                <h4 style="color: #0f3b6f; margin-bottom: 12px;"><i class="fas fa-sync-alt"></i> Update Status</h4>
                <select id="updateStatus" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;">
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <div style="display: flex; gap: 12px; margin-top: 15px;">
                    <button class="btn-primary" onclick="updateBookingStatus()" style="flex: 1; padding: 10px; cursor: pointer;">Update Status</button>
                    <button class="btn-secondary" onclick="closeModal()" style="flex: 1; padding: 10px; cursor: pointer;">Close</button>
                </div>
            </div>
        `;

        document.getElementById('bookingDetailsContent').innerHTML = fullHtml;
        document.getElementById('updateStatus').value = booking.status;
        document.getElementById('bookingModal').style.display = 'flex';
    }

    function updateBookingStatus() {
        const newStatus = document.getElementById('updateStatus').value;

        if (!confirm(`Are you sure you want to change the booking status to "${newStatus}"?`)) {
            return;
        }

        fetch(`{{ url_for("admin_bp.api_update_booking", booking_id=0) }}`.replace('0', currentBookingId), {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status: newStatus})
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Booking status updated successfully');
                closeModal();
                loadBookings();
            } else {
                alert('Error updating booking status: ' + (data.message || 'Unknown error'));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error updating booking status');
        });
    }

    function closeModal() {
        document.getElementById('bookingModal').style.display = 'none';
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById('bookingModal');
        if (event.target === modal) {
            closeModal();
        }
    }

    // Load bookings on page load
    loadBookings();
</script>
{% endblock %}
