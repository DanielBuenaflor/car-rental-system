<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ newsletter_subject }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', Arial, sans-serif; 
            line-height: 1.6; 
            color: #1e293b;
            background: #f8fafc;
            padding: 20px;
        }
        .email-container { 
            max-width: 550px; 
            margin: 0 auto; 
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .header { 
            background: #0f3b6f; 
            color: white; 
            padding: 30px 25px; 
            text-align: center; 
        }
        .header h1 { 
            font-weight: 800; 
            font-size: 26px; 
            letter-spacing: -0.02em;
            margin: 0 0 4px 0;
        }
        .header p {
            font-size: 13px;
            opacity: 0.85;
        }
        .content { 
            padding: 35px 30px; 
        }
        .greeting {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #0f3b6f;
        }
        .newsletter-content { 
            background: #f8fafc; 
            padding: 20px; 
            border-radius: 10px; 
            margin: 20px 0; 
            border: 1px solid #e2e8f0;
        }
        .newsletter-content h3 {
            color: #0f3b6f;
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .newsletter-content div {
            color: #475569;
            line-height: 1.7;
            font-size: 14px;
        }
        .button { 
            display: inline-block; 
            padding: 14px 32px; 
            background: #0f3b6f; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600;
            font-size: 15px;
            margin: 10px 0;
            transition: all 0.2s;
        }
        .button:hover {
            background: #1e4a7a;
        }
        .footer { 
            text-align: center; 
            padding: 20px; 
            font-size: 12px; 
            color: #94a3b8; 
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        .footer a {
            color: #0f3b6f;
            text-decoration: none;
        }
        .unsubscribe {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 15px;
            text-align: center;
            padding: 12px 15px;
            background: #f1f5f9;
            border-radius: 8px;
            line-height: 1.6;
        }
        .unsubscribe a {
            color: #0f3b6f;
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .content { padding: 25px 20px; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>CarRental Pro</h1>
            <p>Newsletter</p>
        </div>
        <div class="content">
            <div class="greeting">Hello {{ username }},</div>
            
            <div class="newsletter-content">
                <h3>{{ newsletter_subject }}</h3>
                <div>{{ content|safe }}</div>
            </div>
            
            <center>
                <a href="{{ url_for('base_bp.index', _external=True) }}" class="button">Visit Our Website</a>
            </center>
        </div>
        <div class="footer">
            <p>&copy; 2025 CarRental Pro. All rights reserved.</p>
            <div class="unsubscribe">
                <p>You're receiving this email because you subscribed to our newsletter.</p>
                <p><a href="{{ unsubscribe_link }}">Unsubscribe</a> at any time.</p>
            </div>
        </div>
    </div>
</body>
</html>
