<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CarRental Pro Newsletter</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #0f3b6f; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; background: #f9f9f9; }
        .newsletter-content { background: white; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #666; }
        .unsubscribe { font-size: 11px; color: #999; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>CarRental Pro</h2>
        </div>
        <div class="content">
            <h3>Hello {{ username }},</h3>
            <div class="newsletter-content">
                <h3>{{ newsletter_subject }}</h3>
                <div>{{ content|safe }}</div>
            </div>
            <div class="unsubscribe">
                <p>You're receiving this email because you subscribed to our newsletter.</p>
                <p><a href="{{ unsubscribe_link }}">Unsubscribe</a> at any time.</p>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2025 CarRental Pro. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
